<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Attention Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
            margin: 5px 0;
            font-size: 20px;
        }

        .controls {
            margin: 5px 0;
            padding: 8px;
            padding-bottom: 30px;
            background-color: white;
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            font-size: 13px;
        }

        .controls label {
            margin-right: 8px;
            font-weight: bold;
        }

        .controls select {
            margin-right: 15px;
            padding: 3px 8px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .layer-control {
            display: inline-block;
            margin-left: 15px;
        }

        .slider-container {
            position: relative;
            width: 900px;
            margin-top: 8px;
            height: 40px;
        }

        #layer-slider {
            width: 100%;
            margin: 0;
            position: relative;
            z-index: 2;
        }

        #layer-value {
            font-weight: bold;
            color: #333;
            margin-left: 8px;
            font-size: 13px;
        }

        #slider-ticks {
            position: absolute;
            top: 22px;
            left: 0;
            width: 100%;
            height: 25px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .tick {
            position: relative;
            width: 2px;
            height: 6px;
            background-color: #666;
        }

        .tick-label {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #666;
            white-space: nowrap;
        }

        #metadata {
            margin: 5px 0;
            padding: 5px 10px;
            background-color: white;
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            font-size: 12px;
        }

        #metadata p {
            margin: 3px 0;
        }

        #tokens-container {
            margin: 5px 0;
            padding: 10px;
            background-color: white;
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            line-height: 1.3;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .token {
            display: inline-block;
            padding: 2px 4px;
            margin: 0px 1px;
            border-radius: 2px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.3;
            vertical-align: top;
        }

        .incorrect-message {
            color: #d32f2f;
            font-size: 14px;
            font-weight: bold;
            padding: 10px;
            text-align: center;
        }

        .error-message {
            color: #d32f2f;
            font-size: 13px;
            padding: 10px;
            text-align: center;
            background-color: #ffebee;
            border-radius: 3px;
            margin: 5px 0;
        }

        .loading-message {
            color: #1976d2;
            font-size: 13px;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Attention Visualization</h1>

    <div class="controls">
        <label>Flow:</label>
        <select id="flow-select">
            <option value="">-- Select a flow --</option>
        </select>

        <label>Instance:</label>
        <select id="instance-select">
            <!-- Options will be populated by JavaScript -->
        </select>

        <div class="layer-control">
            <label>Layer:</label>
            <span id="layer-value">Layer 0</span>
            <div class="slider-container">
                <input type="range" id="layer-slider" min="0" max="0" value="0" step="1" />
                <div id="slider-ticks"></div>
            </div>
        </div>
    </div>

    <div id="metadata">
        <p><strong>Question:</strong> <span id="question"></span></p>
        <p><strong>Ground Truth:</strong> <span id="ground-truth"></span></p>
        <p><strong>Correct:</strong> <span id="is-correct"></span></p>
    </div>

    <div id="tokens-container">
        <div class="loading-message">Please select a flow to view attention visualization.</div>
    </div>

    <script>
        // Global variable to hold current instances data
        window.instances = [];
        let currentDataScript = null;

        // Check if attn_data.js exists for a given hash
        async function checkAttnDataExists(hashValue) {
            try {
                const response = await fetch(`exp/${hashValue}/attn_data.js`, { method: 'HEAD' });
                return response.ok;
            } catch {
                return false;
            }
        }

        // Load flow_to_hash.json and populate flow select
        async function loadFlowsIndex() {
            try {
                document.getElementById('tokens-container').innerHTML =
                    '<div class="loading-message">Loading available flows...</div>';

                const response = await fetch('exp/flow_to_hash.json');
                if (!response.ok) {
                    throw new Error('Failed to load flow_to_hash.json');
                }
                const flowToHash = await response.json();

                // Sort flows alphabetically by description
                const sortedFlows = Object.entries(flowToHash).sort((a, b) => {
                    // Empty string first
                    if (a[0] === '') return -1;
                    if (b[0] === '') return 1;
                    return a[0].localeCompare(b[0]);
                });

                // Check which flows have attn_data.js (in parallel)
                const availabilityChecks = sortedFlows.map(async ([flowDesc, hashValue]) => {
                    const exists = await checkAttnDataExists(hashValue);
                    return { flowDesc, hashValue, exists };
                });

                const results = await Promise.all(availabilityChecks);

                // Filter to only flows with data
                const availableFlows = results.filter(r => r.exists);

                const flowSelect = document.getElementById('flow-select');
                flowSelect.innerHTML = '<option value="">-- Select a flow --</option>';

                if (availableFlows.length === 0) {
                    document.getElementById('tokens-container').innerHTML =
                        '<div class="error-message">No flows with attention data found. Run run_attn_visual.py to generate attention data.</div>';
                    return;
                }

                availableFlows.forEach(({ flowDesc, hashValue }) => {
                    const option = document.createElement('option');
                    option.value = hashValue;  // Hash value as the actual path
                    option.textContent = flowDesc || '(baseline)';  // Flow description as display text
                    flowSelect.appendChild(option);
                });

                document.getElementById('tokens-container').innerHTML =
                    `<div class="loading-message">Found ${availableFlows.length} flow(s) with attention data. Please select a flow.</div>`;
            } catch (error) {
                console.error('Error loading flow_to_hash.json:', error);
                document.getElementById('tokens-container').innerHTML =
                    '<div class="error-message">Error: Could not load exp/flow_to_hash.json. Make sure the file exists and you are using an HTTP server (python -m http.server 8000).</div>';
            }
        }

        // Load attention data for selected flow
        async function loadFlowData(hashValue) {
            if (!hashValue) {
                window.instances = [];
                document.getElementById('tokens-container').innerHTML =
                    '<div class="loading-message">Please select a flow to view attention visualization.</div>';
                return;
            }

            try {
                document.getElementById('tokens-container').innerHTML =
                    '<div class="loading-message">Loading attention data...</div>';

                // Remove old script if exists
                if (currentDataScript) {
                    document.body.removeChild(currentDataScript);
                    currentDataScript = null;
                    window.instances = [];
                }

                // Load new data script using hash value
                const script = document.createElement('script');
                script.src = `exp/${hashValue}/attn_data.js`;
                script.onload = () => {
                    // attn_data.js sets global 'window.instances' variable
                    if (window.instances && window.instances.length > 0) {
                        populateInstanceSelect();
                        updateVisualization();
                    } else {
                        document.getElementById('tokens-container').innerHTML =
                            '<div class="error-message">No attention data found in this flow.</div>';
                    }
                };
                script.onerror = () => {
                    document.getElementById('tokens-container').innerHTML =
                        '<div class="error-message">Error: Could not load attention data for this flow. Make sure exp/' + hashValue + '/attn_data.js exists.</div>';
                };

                currentDataScript = script;
                document.body.appendChild(script);
            } catch (error) {
                console.error('Error loading flow data:', error);
                document.getElementById('tokens-container').innerHTML =
                    '<div class="error-message">Error loading flow data: ' + error.message + '</div>';
            }
        }

        // Populate instance select options
        function populateInstanceSelect() {
            const instanceSelect = document.getElementById('instance-select');
            instanceSelect.innerHTML = '';

            window.instances.forEach((instance, i) => {
                const status = instance.is_correct ? 'CORRECT' : 'INCORRECT';
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Instance ${i} (${status})`;
                instanceSelect.appendChild(option);
            });
        }

        function updateVisualization() {
            if (!window.instances || window.instances.length === 0) {
                return;
            }

            const instanceIdx = parseInt(document.getElementById('instance-select').value);
            const instance = window.instances[instanceIdx];

            // Update metadata
            document.getElementById('question').textContent = instance.question;
            document.getElementById('ground-truth').textContent = instance.ground_truth;
            document.getElementById('is-correct').textContent = instance.is_correct ? 'Yes' : 'No';

            // Update layer slider if needed
            const layerSlider = document.getElementById('layer-slider');
            if (instance.is_correct && instance.attention_maps.length > 0) {
                const numLayers = instance.attention_maps.length;
                layerSlider.max = numLayers - 1;
                layerSlider.value = Math.min(parseInt(layerSlider.value), numLayers - 1);
                document.getElementById('layer-value').textContent = `Layer ${layerSlider.value}`;

                // Update slider ticks
                updateSliderTicks(numLayers);
            }

            // Check if correct
            if (!instance.is_correct) {
                document.getElementById('tokens-container').innerHTML =
                    '<div class="incorrect-message">INCORRECT - No visualization available</div>';
                return;
            }

            // Get selected layer (sparse format)
            const layerIdx = parseInt(layerSlider.value);
            const sparseAttention = instance.attention_maps[layerIdx];
            const tokens = instance.tokens;

            // Find min and max from sparse values only (for normalization)
            const sparseValues = Object.values(sparseAttention);
            const minWeight = sparseValues.length > 0 ? Math.min(...sparseValues) : 0;
            const maxWeight = sparseValues.length > 0 ? Math.max(...sparseValues) : 1;

            // Generate token HTML (directly from sparse format)
            const tokensHtml = tokens.map((token, i) => {
                // Get weight from sparse dict (0 if not present)
                const weight = sparseAttention[i.toString()] || 0.0;
                const normalized = weight > 0 ? (weight - minWeight) / (maxWeight - minWeight) : 0;

                // Use white to red colormap
                const color = getColor(normalized);

                // Add red border if weight > 0, transparent border otherwise (to maintain layout)
                const borderColor = weight > 0 ? 'red' : 'transparent';

                // Replace "Ġ" with actual space for display
                const displayToken = token.replace(/Ġ/g, ' ');

                return `<span class="token" style="background-color: ${color}; border: 1px solid ${borderColor};" title="Weight: ${weight.toFixed(4)}">${escapeHtml(displayToken)}</span>`;
            }).join('');

            document.getElementById('tokens-container').innerHTML = tokensHtml;
        }

        function updateSliderTicks(numLayers) {
            const ticksContainer = document.getElementById('slider-ticks');
            ticksContainer.innerHTML = '';

            // Create tick marks for each layer
            for (let i = 0; i < numLayers; i++) {
                const tick = document.createElement('div');
                tick.className = 'tick';

                const label = document.createElement('div');
                label.className = 'tick-label';
                label.textContent = i;

                tick.appendChild(label);
                ticksContainer.appendChild(tick);
            }
        }

        function getColor(value) {
            // White to Red colormap
            // value in [0, 1], 0 = white (255,255,255), 1 = red (255,0,0)
            const r = 255;
            const g = Math.floor(255 * (1 - value));
            const b = Math.floor(255 * (1 - value));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('flow-select').addEventListener('change', (e) => {
            const hashValue = e.target.value;
            loadFlowData(hashValue);
        });

        document.getElementById('instance-select').addEventListener('change', () => {
            // Reset layer slider when instance changes
            const layerSlider = document.getElementById('layer-slider');
            layerSlider.value = 0;
            updateVisualization();
        });

        document.getElementById('layer-slider').addEventListener('input', () => {
            const layerIdx = document.getElementById('layer-slider').value;
            document.getElementById('layer-value').textContent = `Layer ${layerIdx}`;
            updateVisualization();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (event) => {
            const instanceSelect = document.getElementById('instance-select');
            const layerSlider = document.getElementById('layer-slider');

            switch(event.key) {
                case 'ArrowLeft':
                    // Decrease layer
                    event.preventDefault();
                    if (parseInt(layerSlider.value) > parseInt(layerSlider.min)) {
                        layerSlider.value = parseInt(layerSlider.value) - 1;
                        document.getElementById('layer-value').textContent = `Layer ${layerSlider.value}`;
                        updateVisualization();
                    }
                    break;

                case 'ArrowRight':
                    // Increase layer
                    event.preventDefault();
                    if (parseInt(layerSlider.value) < parseInt(layerSlider.max)) {
                        layerSlider.value = parseInt(layerSlider.value) + 1;
                        document.getElementById('layer-value').textContent = `Layer ${layerSlider.value}`;
                        updateVisualization();
                    }
                    break;

                case 'ArrowUp':
                    // Previous instance
                    event.preventDefault();
                    if (instanceSelect.selectedIndex > 0) {
                        instanceSelect.selectedIndex--;
                        layerSlider.value = 0;
                        updateVisualization();
                    }
                    break;

                case 'ArrowDown':
                    // Next instance
                    event.preventDefault();
                    if (instanceSelect.selectedIndex < instanceSelect.options.length - 1) {
                        instanceSelect.selectedIndex++;
                        layerSlider.value = 0;
                        updateVisualization();
                    }
                    break;
            }
        });

        // Initial setup
        loadFlowsIndex();
    </script>
</body>
</html>
